name: octopus-expertise-mvp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: octopus_expertise
      POSTGRES_USER: octopus
      POSTGRES_PASSWORD: octopus
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octopus -d octopus_expertise"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
